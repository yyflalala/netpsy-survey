<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大学生网络心理与社交媒体使用状况调查（互动版）</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f3f5f8;color:#24292f;line-height:1.6}
#app{max-width:620px;margin:0 auto;padding:0 14px 100px}
.top{position:sticky;top:0;z-index:9;background:#f3f5f8;padding:10px 0 6px}
h1{font-size:17px;margin:0 0 8px}
.pbar{height:8px;background:#e2e7ee;border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#6366f1);transition:width .3s}
.ptxt{font-size:12px;color:#6a737d;margin-top:4px}
.card{background:#fff;border-radius:14px;padding:16px 14px;margin-top:12px;box-shadow:0 1px 5px rgba(0,0,0,.05)}
.intro{font-size:13.5px;color:#57606a}
.q{margin:18px 0 6px;font-weight:600}
.sub{font-size:12px;color:#8a94a0;font-weight:400}
.opt{display:flex;align-items:center;border:1.5px solid #e4e8ee;border-radius:10px;padding:11px 12px;margin:7px 0;cursor:pointer;background:#fff;font-size:14.5px}
.opt .dot{width:18px;height:18px;border:2px solid #b6bfc9;border-radius:50%;margin-right:10px;flex:none}
.opt.sel{border-color:#3b82f6;background:#eef5ff}
.opt.sel .dot{border-color:#3b82f6;background:#3b82f6}
.opt.sel .dot::after{content:"✓";color:#fff;font-size:12px;line-height:15px;text-align:center;display:block}
.opt input{display:none}
.opt.miss{border-color:#ef4444;background:#fff5f5}
.lk{display:flex;gap:5px;margin:8px 0 2px}
.lk label{flex:1;border:1.5px solid #e4e8ee;border-radius:9px;text-align:center;font-size:11.5px;padding:9px 2px;cursor:pointer;background:#fff;line-height:1.35}
.lk label.sel{border-color:#3b82f6;background:#3b82f6;color:#fff;font-weight:600}
.lk label.miss{border-color:#ef4444}
.item{margin-top:14px}
.item p{margin:0;font-size:14.5px}
.inum{color:#8a94a0;font-size:12px;margin-right:4px}
.dimchip{font-size:11px;color:#6a737d;background:#f0f3f7;border-radius:20px;padding:2px 10px;display:inline-block;margin:2px 0 6px}
textarea{width:100%;min-height:88px;border:1.5px solid #e4e8ee;border-radius:10px;padding:10px;font:inherit;font-size:14px;resize:vertical}
textarea:focus{outline:none;border-color:#3b82f6}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.07);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:9}
.nav .inner{max-width:620px;margin:0 auto;display:flex;gap:10px}
.nav button{flex:1;border:0;border-radius:12px;padding:13px 10px;font-size:15px;font-weight:600}
.b1{background:#3b82f6;color:#fff}.b2{background:#eef1f5;color:#424a53}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(30,35,42,.92);color:#fff;font-size:13px;padding:8px 16px;border-radius:20px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86%;text-align:center}
.res h2{font-size:16.5px;margin:4px 0}
.badge{display:inline-block;font-size:13px;font-weight:600;border-radius:20px;padding:5px 14px;margin:4px 0}
.b-low{background:#e7f7f0;color:#0e8a5f}.b-mid{background:#fef3e2;color:#b45309}.b-high{background:#fdeaea;color:#dc2626}.b-skip{background:#e8f1ff;color:#2563eb}
.drow{margin:12px 0}
.drow .t{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px}
.sbar{height:10px;background:#edf0f4;border-radius:5px;overflow:hidden}
.sbar i{display:block;height:100%;border-radius:5px}
.c-low{background:#10b981}.c-mid{background:#f59e0b}.c-high{background:#ef4444}
ul.pts{padding-left:20px;margin:6px 0}.pts li{margin:5px 0;font-size:14px}
.note{font-size:12.5px;color:#6a737d}
#exp{width:100%;min-height:150px;font-size:11.5px;margin-top:6px}
.rbtns{display:flex;gap:10px;margin-top:10px}
.rbtns button{flex:1}
.badge2{display:inline-block;min-width:20px;height:20px;border-radius:50%;background:#c3cbd4;color:#fff;font-size:12px;line-height:20px;text-align:center;margin-right:10px;flex:none}
.opt.sel .badge2{background:#fff;color:#3b82f6;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <h1>大学生网络心理与社交媒体使用状况调查</h1>
    <div class="pbar"><i id="pfill"></i></div>
    <div class="ptxt" id="ptxt"></div>
  </div>
  <div id="stage"></div>
</div>
<div class="nav" id="nav"><div class="inner">
  <button class="b2" id="bprev">上一部分</button>
  <button class="b1" id="bnext">下一部分</button>
</div></div>
<div id="toast"></div>
<script>
var LSK='npsy_survey_v1';
/* ===== 数据回收配置（不需要改文件）=====
 发放链接末尾加 ?recv=你的邮箱 即启用：例 https://你的网址/?recv=teacher@xx.edu.cn
 学生提交后，匿名作答 JSON 会自动发到该邮箱（首次需在邮箱里点一次激活链接）。
 研究端面板：打开 你的网址#admin */
var RECV=(function(){try{var m=location.search.match(/[?&]recv=([^&]+)/);return m?decodeURIComponent(m[1]):''}catch(e){return''}})();
var SUBMIT_URL=RECV?('https://formsubmit.co/ajax/'+RECV):'';
var LK=['完全不符合','比较不符合','不确定','比较符合','完全符合'];

var BASIC=[
 {k:'gender',t:'radio',n:'Q1. 您的性别',o:['男','女']},
 {k:'grade',t:'radio',n:'Q2. 您的年级',o:['大一','大二','大三','大四及以上（含大五、研究生）']},
 {k:'major',t:'radio',n:'Q3. 您的专业类别',o:['人文社科类','经济管理类','理工类','农林类','医学类','艺术体育类','其他']},
 {k:'origin',t:'radio',n:'Q4. 您的生源地（高考前长期居住地）',o:['城市（地级市及以上）','县镇（县城及建制镇）','农村']},
 {k:'hours',t:'radio',n:'Q5. 您平均每天使用网络（手机、电脑等）的总时长约为',o:['1小时以内','1–2小时（含2小时）','2–4小时（含4小时）','4–6小时（含6小时）','6小时以上']},
 {k:'plat',t:'check',max:3,n:'Q6. 您目前最常使用的社交平台是',ph:'最多选 3 项 —— 后续部分题目将根据您的选择自动定制',o:['微信','QQ','抖音/快手','小红书','微博','哔哩哔哩（B站）','知乎/豆瓣','其他']},
 {k:'freq',t:'radio',n:'Q7. 您平时使用网络（手机、电脑等）的频率是',o:['几乎不上网（除必要事务外基本不使用）','每天偶尔登录几次','每天经常使用，但可以随时放下','几乎时刻在线，长时间不碰手机会不习惯']}
];
var BEH=[
 {k:'periods',t:'check',n:'Q8. 您通常在哪些时段上网？',o:['早晨起床后半小时内','上课或自习时间','课间与午休','下午课后至晚饭前','晚饭后','睡前（22:00以后）','夜间醒来时（如起夜顺手刷手机）']},
 {k:'devices',t:'check',n:'Q9. 您常用的上网设备有',o:['智能手机','笔记本电脑','台式电脑','平板电脑','其他联网设备（智能手表、游戏机等）']},
 {k:'acts',t:'check',n:'Q10. 您的主要网络活动类型有',o:['即时通讯与社交（微信/QQ聊天、朋友圈等）','刷短视频（抖音、快手等）','看网络直播','玩网络游戏','看影视剧、综艺','学习、查资料、上网课','网络购物','浏览新闻资讯','创作发布内容（发动态、拍视频、发帖等）','听音乐、听书、播客','其他']},
 {k:'rank',t:'rank',min:3,n:'Q11. 请按每周花费时间从多到少，点击下列活动进行排序',ph:'点击选项即按顺序编号，再点一次取消；至少排 3 项',o:['短视频','即时通讯与社交','网络游戏','影视剧综艺','学习查资料','网络购物','浏览资讯']},
 {k:'toolh',t:'radio',n:'Q12. 您平均每天用于学习查资料、处理事务等"工具性用途"的上网时间约为',o:['几乎为0','1小时以内','1–2小时（含2小时）','2–4小时（含4小时）','4小时以上']},
 {k:'funh',t:'radio',n:'Q13. 您平均每天用于刷视频、玩游戏、追剧、闲逛社交动态等"娱乐沉浸性用途"的上网时间约为',o:['几乎为0','1小时以内','1–2小时（含2小时）','2–4小时（含4小时）','4小时以上']},
 {k:'bed',t:'radio',n:'Q14. 您平均每天熄灯躺下后继续使用手机等设备的时长约为',o:['基本不用','30分钟以内','30分钟–1小时（含1小时）','1–2小时（含2小时）','2小时以上']},
 {k:'motive',t:'check',max:3,n:'Q15. 您上网（含刷社交媒体）的主要动机是',ph:'最多选 3 项',o:['获取信息、辅助学习','联络朋友、维系感情','放松娱乐、缓解压力','打发无聊时间','逃避现实中的压力或烦恼','记录分享自己的生活','追热点，怕跟不上大家的话题','大家都在用，不用会不合群','其他']}
];
var ANX=[
 ['a1','我担心自己在社交平台上发布的内容（如动态、照片）得不到他人的认可'],
 ['a2','在{P}发布内容后，我会反复查看有没有人点赞或评论'],
 ['a3','我担心自己在网上发表的言论会被别人负面评价'],
 ['a4','别人对我发布内容的点赞、评论情况会明显影响我的心情'],
 ['a5','我不在意别人如何看待我在网上发布的内容'],
 ['a6','在{P}上与他人互动（如评论、私聊）时，我会感到紧张不安'],
 ['a7','网络聊天时，我担心自己说错话或语气不当'],
 ['a8','给不太熟悉的同学或老师发消息前，我会反复斟酌措辞'],
 ['a9','在班级群或{P}的群聊、评论区发言前，我会犹豫很久'],
 ['a10','与陌生网友在网上交流时，我会感到拘束'],
 ['a11','我对自己在网络上公开的个人信息（如照片、定位）感到不安全'],
 ['a12','发布动态时，我会顾虑个人隐私暴露的问题'],
 ['a13','我担心自己在网上的个人信息被他人滥用或传播'],
 ['a14','出于隐私顾虑，我会设置分组可见或减少发布内容'],
 ['a15','我觉得在社交平台上分享个人信息没什么可担心的']
];
var IAS=[
 ['i1','我发现自己上网的时间越来越长'],
 ['i2','我需要越来越多的上网时间才能获得同样的满足感'],
 ['i3','无法上网时（如断网、手机没电），我会感到烦躁不安'],
 ['i4','不能上网时，我总惦记着网上的内容，难以专心做其他事'],
 ['i5','我常常控制不住地打开手机刷个不停'],
 ['i6','我能很好地控制自己每天上网的时间和场合'],
 ['i7','我多次尝试减少上网时间，但都以失败告终'],
 ['i8','上网已经影响到我的学习效率或成绩'],
 ['i9','因为熬夜上网，我的睡眠或作息受到了影响'],
 ['i10','上网并没有妨碍我完成学习任务和其他重要安排']
];
var FOMO=[
 ['f1','当我不知道朋友们在{P}上做什么时，我会感到不安，怕错过什么'],
 ['f2','我担心别人在我不知道的时候有了更多有趣的经历'],
 ['f3','看到{P}上的新消息提醒，我会忍不住立刻查看'],
 ['f4','如果有一段时间不能上网了解大家的动态，我会感到与外界脱节'],
 ['f5','我害怕错过{P}上的重要消息或朋友动态'],
 ['f6','即使错过大家正在讨论的热点话题，我也觉得无所谓']
];
var REV={a5:1,a15:1,i6:1,i10:1,f6:1};
var NEED=[
 {k:'service',t:'check',max:3,n:'Q47. 您希望学校提供哪些网络心理健康服务？',ph:'最多选 3 项',o:['网络心理与媒介素养专题讲座','一对一心理咨询（含网络使用困扰主题）','时间管理与自律能力训练团体','正念冥想、放松训练课程','"数字排毒"打卡挑战活动','朋辈互助支持小组','线上心理自助资源推送（科普推文、自测工具）','其他']},
 {k:'effect',t:'radio',n:'Q48. 总体而言，您认为网络使用对您心理健康的影响是',o:['积极影响为主','消极影响为主','积极与消极兼有','几乎没有影响']},
 {k:'open1',t:'textarea',req:0,n:'Q49.【选填】您认为网络使用对您心理健康影响最大的一个方面是什么？',ph:'用一两句话简要说明即可，不填不影响提交'},
 {k:'open2',t:'textarea',req:0,n:'Q50.【选填】您对学校开展网络心理健康服务还有什么建议或期望？',ph:'选填'}
];
var SELF=[
 {k:'self',t:'radio',n:'Q51. 总体而言，您如何评价自己目前的网络使用状况？',o:['非常适度、健康','比较适度','一般，偶尔失控','经常有些失控','明显失控，想改变但很难']},
 {k:'will',t:'radio',n:'Q52. 填写本问卷后，您是否愿意有意识地反思并调整自己的上网习惯？',o:['愿意，并且打算开始行动','愿意，但不确定能否做到','暂时没有这方面打算']}
];
var keyQ={};
BASIC.concat(BEH,NEED,SELF).forEach(function(q){keyQ[q.k]=q});

var S={};
var steps=[],si=0;

function P(){var a=S.plat||[];return (a.length&&a[0]!=='其他')?a[0]:'社交平台'}
function lowUse(){return S.hours==='1小时以内'||(typeof S.freq==='string'&&S.freq.indexOf('几乎不上网')===0)}
function ix(k){var q=keyQ[k];return q&&q.o?q.o.indexOf(S[k]):-1}
function activeProbes(){return PROBES.filter(function(p){return p.cond()})}
var PROBES=[
 {k:'p1',t:'check',n:'P1. 您睡前这段时间主要在做什么？',o:['刷短视频','即时聊天','追剧、看电影','玩游戏','浏览社交媒体动态','学习、查资料','其他'],
  cond:function(){return ix('bed')>=2}},
 {k:'p2',t:'radio',n:'P2. 回想最近一个月，您觉得自己的娱乐性上网时间：',o:['完全在掌控中','基本可控','有些超出计划','明显超出计划'],
  cond:function(){return ix('funh')>=3}},
 {k:'p3',t:'radio',n:'P3. 您平均每天刷短视频的总时长约为',o:['30分钟以内','30分钟–1小时','1–2小时','2–3小时','3小时以上'],
  cond:function(){return (S.acts||[]).indexOf('刷短视频（抖音、快手等）')>-1||(S.plat||[]).indexOf('抖音/快手')>-1}}
];
function buildSteps(){
 steps=['consent','basic','beh'];
 if(activeProbes().length)steps.push('probes');
 steps.push('anx');
 if(!lowUse())steps.push('ia');
 steps.push('fomo','need','self','res');
}
function save(){try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity=0},1800)}

function opts(q){
 if(q.t==='radio')return q.o.map(function(v){return '<label class="opt" data-k="'+q.k+'" data-v="'+v+'"><input type="radio" name="'+q.k+'" value="'+v+'"'+(S[q.k]===v?' checked':'')+'><span class="dot"></span><span>'+v+'</span></label>'}).join('');
 if(q.t==='check')return q.o.map(function(v){var c=(S[q.k]||[]).indexOf(v)>-1;return '<label class="opt" data-k="'+q.k+'" data-v="'+v+'"><input type="checkbox" name="'+q.k+'" value="'+v+'"'+(c?' checked':'')+'><span class="dot"></span><span>'+v+'</span></label>'}).join('');
 if(q.t==='rank'){var arr=S[q.k]||[];return q.o.map(function(v){var i=arr.indexOf(v);return '<div class="opt '+(i>-1?'sel':'')+'" data-k="'+q.k+'" data-v="'+v+'"><span class="badge2">'+(i>-1?i+1:'')+'</span><span>'+v+'</span></div>'}).join('')}
 return '';
}
function qHTML(q){
 var h='<div class="q">'+q.n+(q.max?'<span class="sub">（最多选'+q.max+'项）</span>':'')+'</div>';
 if(q.ph)h+='<div class="note" style="margin:-2px 0 4px">'+q.ph+'</div>';
 if(q.t==='textarea')h+='<textarea data-k="'+q.k+'" placeholder="'+(q.ph||'')+'">'+(S[q.k]||'')+'</textarea>';
 else h+=opts(q);
 return h;
}
function likert(items,startNum){
 return items.map(function(it,i){
  var k=it[0],t=it[1].replace(/\{P\}/g,P());
  var row=LK.map(function(l,j){var sel=S[k]==String(j+1);return '<label class="'+(sel?'sel':'')+'" data-k="'+k+'" data-v="'+(j+1)+'"><input type="radio" name="'+k+'" value="'+(j+1)+'"'+(sel?' checked':'')+'>'+l+'</label>'}).join('');
  return '<div class="item"><p><span class="inum">'+(startNum+i)+'.</span>'+t+'</p><div class="lk">'+row+'</div></div>';
 }).join('');
}
function scaleHead(txt){
 return '<div class="intro">请根据<b>最近一个月</b>的实际情况选择最符合您状态的选项：<br>1=完全不符合，2=比较不符合，3=不确定，4=比较符合，5=完全符合。答案无对错之分。</div>'+txt;
}

function renderStep(keepScroll){
 var y=window.scrollY;
 var st=steps[si],h='';
 if(st==='consent'){
  h='<div class="card"><h2 style="margin-top:0">指导语与知情同意</h2><div class="intro">'
  +'<p>亲爱的同学，你好！本调查旨在了解大学生网络使用与心理状况，为学校改进网络心理健康教育提供依据。</p>'
  +'<p><b>匿名保障</b>：本问卷<b>完全匿名</b>，不收集姓名、学号、手机号等任何可识别身份的信息；'+(SUBMIT_URL?'提交时，您的匿名作答将发送至课题组指定邮箱。':'所有作答与评估均<b>在本机完成，不上传任何数据</b>。')+'</p>'
  +'<p><b>预计用时</b>：8–12 分钟（共约 50 题）。题目会根据您前面的回答自动定制后续内容。</p>'
  +'<p><b>自愿参与</b>：可随时关闭页面退出，不会带来任何不利影响。最后一页将为您生成专属的网络心理自评报告（仅供自我参考，不构成临床诊断）。</p></div>'
  +'<div class="q">Q0. 请确认：<label class="opt" data-k="consent" data-v="1" style="margin-top:8px"><input type="radio" name="consent" value="1"'+(S.consent?' checked':'')+'><span class="dot"></span><span>我已阅读并同意参与，且已年满 18 周岁（或已征得监护人同意）</span></label></div></div>';
 }else if(st==='basic'){

 var tier='较低';
 if(lu)tier='不适用（低使用）';
 else if(ias!=null&&(ias>=3.5||(ias>=3.0&&fdm>=3.5)))tier='较高';
 else if(ias!=null&&ias>=3.0&&(fom>=3.5||sas>=3.5||ix('self')>=3))tier='中等';
 p['风险等级']=tier;
 return p;
}
function maybeSubmit(force){
 if(!SUBMIT_URL)return;
 if(S._submitted&&!force)return;
 var st=document.getElementById('substat');if(st)st.textContent='正在提交…';
 fetch(SUBMIT_URL,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(buildPayload())})
 .then(function(r){return r.json()})
 .then(function(d){
  var ok=d&&(d.success===true||d.success==='true');
  var st2=document.getElementById('substat');
  if(ok){S._submitted=1;save();if(st2)st2.textContent='✓ 已成功提交，感谢参与';toast('已提交至研究端')}
  else{if(st2)st2.textContent='提交未确认：首次使用请先在研究邮箱中完成激活，再点"手动提交"重试'}
 }).catch(function(){var st3=document.getElementById('substat');if(st3)st3.textContent='网络提交失败，可点"手动提交"重试，或用"一键复制数据"'});
}

/* ===== 研究端面板（网址后加 #admin 打开） ===== */

function adminRows(){try{return JSON.parse(localStorage.getItem(AK)||'[]')}catch(e){return[]}}
function renderAdmin(){
 document.getElementById('nav').style.display='none';
 document.getElementById('pfill').style.width='100%';

 '<div class="card"><h2 style="margin:0 0 6px">① 生成发放链接（启用数据回收）</h2>'
 +'<div class="intro">输入接收作答的邮箱并点击"生成"；把生成的链接发给学生（微信、扫码等均可）。学生提交后，每份匿名作答会以 JSON 邮件自动发到该邮箱。<b>首次</b>收到提交时，FormSubmit 会先发一封激活邮件，点击其中链接一次即长期生效。</div>'
 +'<div style="display:flex;gap:8px;margin-top:10px"><input id="admmail" placeholder="teacher@xx.edu.cn" style="flex:1;border:1.5px solid #e4e8ee;border-radius:10px;padding:10px;font:inherit;font-size:14px"><button class="b1" style="flex:none;padding:10px 16px" id="btnlink">生成</button></div>'
 +'<textarea id="admlink" readonly placeholder="生成的发放链接将显示在这里" style="margin-top:8px;min-height:56px"></textarea>'
 +'<div class="rbtns"><button class="b1" id="btncopylink">复制发放链接</button></div></div>'
 +'<div class="card"><h2 style="margin:0 0 6px">② 数据入库与汇总</h2>'
 +'<div class="intro">把邮箱中收到的作答 JSON（可多封一次性）粘贴到下面，点"解析入库"。数据保存在本机浏览器，仅用于汇总统计。</div>'
 +'<textarea id="admpaste" placeholder="将邮件中的 JSON 作答内容粘贴到这里，支持一次粘贴多份" style="min-height:110px"></textarea>'
 +'<div class="rbtns"><button class="b1" id="btnparse">解析入库</button><button class="b2" id="btncsv">导出CSV</button><button class="b2" id="btnadminclear">清空本机数据</button></div></div>'
 +'<div id="admstats"></div>';
 adminRenderStats();
}
function adminParse(){
 var t=document.getElementById('admpaste').value;
 var cands=t.match(/\{[\s\S]*?\}/g)||[];
 var rows=adminRows(),added=0;
 cands.forEach(function(c){try{var o=JSON.parse(c);if(o&&(o.Q1!=null||o['提交时间'])){rows.push(o);added++}}catch(e){}});
 localStorage.setItem(AK,JSON.stringify(rows));
 toast(added?('已入库 '+added+' 份，当前共 '+rows.length+' 份'):'未解析到有效 JSON，请确认粘贴的是邮件中的作答内容');
 adminRenderStats();
}
function csvEsc(v){v=(v==null?'':String(v));return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function adminCSV(){
 var rows=adminRows();if(!rows.length){toast('暂无数据');return}
 var cols=['提交时间','Q1','Q2','Q3','Q4','Q5','Q6','Q7','Q8','Q9','Q10','Q11','Q12','Q13','Q14','Q15','P1','P2','P3'];
 for(var i=16;i<=52;i++)cols.push('Q'+i);
 cols=cols.concat(['评价恐惧均分','交往焦虑均分','隐私担忧均分','社交焦虑总均分','成瘾总均分','功能损害均分','FoMO均分','风险等级']);
 var csv='\ufeff'+cols.join(',')+'\n'+rows.map(function(r){return cols.map(function(c){return csvEsc(r[c])}).join(',')}).join('\n');
 try{
  var b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download='网络心理调查数据.csv';document.body.appendChild(a);a.click();a.remove();
 }catch(e){var ta=document.getElementById('admpaste');if(ta){ta.value=csv;toast('已填入文本框，请手动全选复制')}}
}
function adminRenderStats(){
 var el=document.getElementById('admstats');if(!el)return;
 var rows=adminRows();
 if(!rows.length){el.innerHTML='<div class="card"><div class="intro">暂无入库数据。先用上方链接发放，再把收到的作答邮件 JSON 粘贴到上方"解析入库"。</div></div>';return}
 function num(r,k){var v=parseFloat(r[k]);return isNaN(v)?null:v}
 function m(a){a=a.filter(function(x){return x!=null});return a.length?a.reduce(function(s,x){return s+x},0)/a.length:null}
 function sd(a){var mu=m(a);if(mu==null||a.length<2)return null;return Math.sqrt(a.reduce(function(s,x){return s+(x-mu)*(x-mu)},0)/(a.length-1))}
 var mets=['评价恐惧均分','交往焦虑均分','隐私担忧均分','社交焦虑总均分','成瘾总均分','功能损害均分','FoMO均分'];
 var agg=mets.map(function(k){
  var a=rows.map(function(r){return num(r,k)});
  var mu=m(a),d=sd(a);
  return '<div class="drow"><div class="t"><span>'+k+'</span><span><b>'+(mu==null?'—':mu.toFixed(2))+'</b>'+(d!=null?' ± '+d.toFixed(2):'')+'（有效 n='+a.length+'）</span></div><div class="sbar"><i class="c-low" style="width:'+((mu||0)/5*100)+'%"></i></div></div>';
 }).join('');
 var tiers=['较高','中等','较低','不适用（低使用）'].map(function(t){
  var n=rows.filter(function(r){return r['风险等级']===t}).length;
  return t+' '+n+' 人（'+Math.round(n/rows.length*100)+'%）';
 }).join('　|　');
 function grp(gv,mk){var g=rows.filter(function(r){return r.Q1===gv});var mu=m(g.map(function(r){return num(r,mk)}));return g.length+' 人'+(mu!=null?' / 均分 '+mu.toFixed(2):' / 无有效数据')}
 var th=['提交时间','性别','年级','日均时长','社交焦虑','成瘾','FoMO','风险'].map(function(h){return '<th style="border:1px solid #e4e8ee;padding:5px 6px;text-align:left;background:#f6f8fa">'+h+'</th>'}).join('');
 var tbl=rows.slice().reverse().map(function(r){
  return '<tr><td style="border:1px solid #e4e8ee;padding:5px 6px">'+csvEsc(r['提交时间']||'')+'</td><td style="border:1px solid #e4e8ee;padding:5px 6px">'+csvEsc(r.Q1||'')+'</td><td style="border:1px solid #e4e8ee;padding:5px 6px">'+csvEsc(r.Q2||'')+'</td><td style="border:1px solid #e4e8ee;padding:5px 6px">'+csvEsc(r.Q5||'')+'</td><td style="border:1px solid #e4e8ee;padding:5px 6px">'+csvEsc(r['社交焦虑总均分']||'')+'</td><td style="border:1px solid #e4e8ee;padding:5px 6px">'+csvEsc(r['成瘾总均分']||'')+'</td><td style="border:1px solid #e4e8ee;padding:5px 6px">'+csvEsc(r['FoMO均分']||'')+'</td><td style="border:1px solid #e4e8ee;padding:5px 6px">'+csvEsc(r['风险等级']||'')+'</td></tr>';
 }).join('');
 el.innerHTML='<div class="card res"><h2>汇总统计（共 '+rows.length+' 份）</h2>'+agg
 +'<div class="note" style="margin-top:8px">风险分布：'+tiers+'</div>'
 +'<div class="note" style="margin-top:6px">性别分组：男 — 社交焦虑 '+grp('男','社交焦虑总均分')+'，成瘾 '+grp('男','成瘾总均分')+'，FoMO '+grp('男','FoMO均分')+'；女 — 社交焦虑 '+grp('女','社交焦虑总均分')+'，成瘾 '+grp('女','成瘾总均分')+'，FoMO '+grp('女','FoMO均分')+'</div>'
 +'</div>'
 +'<div class="card res"><h2>逐份作答明细</h2><div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:12px;min-width:100%">'+ '<tr>'+th+'</tr>'+tbl+'</table></div></div>';
}
